<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dialogue Summarizer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Dialogue Summarizer</h1>
      <p class="subtitle">Paste a conversation and get a concise summary, powered by a fine-tuned Pegasus model.</p>
    </header>

    <main class="card">
      <label for="dialogue-input" class="label">Dialogue</label>
      <textarea
        id="dialogue-input"
        class="textarea"
        placeholder="Amanda: I baked cookies. Do you want some?&#10;Jerry: Sure! Amanda: I'll bring you tomorrow :-)"
      ></textarea>

      <div class="actions">
        <button id="summarize-btn" class="btn-primary">
          <span id="btn-text">Summarize</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>
        <span id="error-msg" class="error hidden"></span>
      </div>

      <div id="result-section" class="result hidden">
        <h2 class="result-label">Summary</h2>
        <p id="result-text" class="result-text"></p>
      </div>
    </main>

    <footer class="footer">
      <p>Fine-tuned google/pegasus-cnn_dailymail on the SAMSum dataset</p>
    </footer>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
